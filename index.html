<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Miza — ledger</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1c1b19" />

  <!-- iOS install support (Safari ignores manifest.json for some of this) -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Miza" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="eyebrow">Miza / ledger</div>
    <h1>Your accounts</h1>

    <div class="balance-row">
      <div>
        <div class="balance-total" id="total-balance">$0.00</div>
        <div class="balance-label">Total across accounts</div>
      </div>
      <div>
        <div class="balance-count" id="account-count">0</div>
        <div class="balance-label">Accounts</div>
      </div>
    </div>

    <div class="accounts-strip" id="accounts-strip"></div>
    <button class="add-acct-btn" id="toggle-acct-form">+ Add account</button>

    <div class="card" id="acct-form" style="display:none;">
      <div class="grid2">
        <div class="full"><label>Account name</label><input id="acct-name" placeholder="e.g. Everyday checking" /></div>
        <div>
          <label>Type</label>
          <select id="acct-type">
            <option value="checking">Checking</option>
            <option value="savings">Savings</option>
            <option value="credit_card">Credit card</option>
            <option value="cash">Cash</option>
            <option value="wallet">Wallet</option>
          </select>
        </div>
        <div><label>Starting balance ($)</label><input id="acct-start" type="number" step="0.01" placeholder="0.00" /></div>
        <div class="full submit-row">
          <span class="err" id="acct-err"></span>
          <button class="primary" id="acct-save">Add account</button>
        </div>
      </div>
    </div>

    <h2>Add a transaction</h2>
    <div class="card">
      <div class="grid2">
        <div class="full type-toggle">
          <div class="type-btn active-expense" id="type-expense" data-type="expense">Expense</div>
          <div class="type-btn" id="type-income" data-type="income">Income</div>
        </div>
        <div class="full"><label>Description</label><input id="tx-desc" placeholder="e.g. Groceries" /></div>
        <div><label>Amount ($)</label><input id="tx-amount" type="number" step="0.01" inputmode="decimal" placeholder="0.00" /></div>
        <div><label>Date</label><input id="tx-date" type="date" /></div>
        <div class="full"><label>Category</label><select id="tx-category"></select></div>
        <div class="full submit-row">
          <span class="err" id="tx-err"></span>
          <button class="primary" id="tx-save">Add transaction</button>
        </div>
      </div>
    </div>

    <h2>Recent activity</h2>
    <div class="ledger" id="ledger"></div>

    <div class="status-bar" id="status-bar"></div>
    <div class="install-hint" id="install-hint" style="display:none;">
      <span>Install Miza on your home screen for the full app feel</span>
      <button id="install-btn" class="primary" style="margin-left:8px;">Install</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
    }
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-hint').style.display = 'flex';
    });
    document.getElementById('install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('install-hint').style.display = 'none';
    });
  </script>
</body>
</html>
